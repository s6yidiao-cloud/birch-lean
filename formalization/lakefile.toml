name = "birch"
version = "0.1.0"
defaultTargets = ["Birch"]
allowNonModules = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[require]]
name = "weil-conjectures"
path = "Vendor/IndependentWeil"

[[lean_lib]]
name = "Birch"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_lib]]
name = "GafniTao"
srcDir = "Vendor/Wooley"
globs = ["GafniTao.+"]
moreLeanArgs = ["-DautoImplicit=false", "-DwarningAsError=true"]

[[lean_lib]]
name = "StacksFrontier"
srcDir = "Vendor/AxiomMath"
moreLeanArgs = ["-DwarningAsError=true"]
