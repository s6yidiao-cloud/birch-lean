name = "birch"
version = "0.1.0"
defaultTargets = ["Birch"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[lean_lib]]
name = "Birch"
moreLeanArgs = ["-DwarningAsError=true"]

# Vendored Wooley modules use the upstream GafniTao namespace.
[[lean_lib]]
name = "GafniTao"
srcDir = "Vendor/Wooley"
globs = ["GafniTao.+"]
moreLeanArgs = ["-DautoImplicit=false", "-DwarningAsError=true"]
